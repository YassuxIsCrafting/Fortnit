name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IleEclair.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IleEclair-apk
          path: IleEclair.apk

      - name: Publier en téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Application Android
          body: |
            APK Android de Île Éclair (version de test, signée en mode debug).
            Sur le téléphone : télécharge IleEclair.apk, ouvre-le et autorise l'installation depuis cette source.
            L'appli charge le jeu en ligne : une connexion Internet est nécessaire.
          files: IleEclair.apk
          make_latest: true
